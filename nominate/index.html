<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nominate Joachim Agou – Victoria–Beacon Hill</title>
<meta name="description" content="Sign up to sign Joachim Agou's nomination paper for Victoria–Beacon Hill.">
<meta name="robots" content="noindex">
<style>
  :root { --blue:#1a4c8b; --bg:#f5f7fb; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#1b1f24; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:.2em 0 .1em; color:var(--blue); }
  .sub { margin:0 0 1em; color:#444; }
  .intro { background:#fff; border-left:4px solid var(--blue); padding:12px 14px; border-radius:6px; margin-bottom:18px; }
  form { background:#fff; padding:16px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label.f { display:block; font-weight:600; margin:14px 0 4px; }
  .opt { font-weight:400; color:#666; }
  input[type=text], input[type=tel], input[type=email] { width:100%; padding:12px; font-size:17px; border:1px solid #bbb; border-radius:8px; }
  input:focus { outline:2px solid var(--blue); border-color:var(--blue); }
  fieldset { border:0; padding:0; margin:14px 0 0; }
  legend { font-weight:600; margin-bottom:4px; }
  .cb { display:flex; gap:10px; align-items:flex-start; padding:9px 0; }
  .cb input { width:22px; height:22px; margin:1px 0 0; flex:none; }
  .hint { font-size:.9rem; color:#666; margin:2px 0 0; }
  button { width:100%; margin-top:18px; padding:14px; font-size:18px; font-weight:700; color:#fff; background:var(--blue); border:0; border-radius:8px; }
  button:disabled { opacity:.6; }
  .msg { margin-top:14px; padding:12px; border-radius:8px; display:none; }
  .err { background:#fdecea; color:#8a1c1c; display:block; }
  .ok { background:#e8f5e9; color:#1b5e20; display:block; }
  .hp { position:absolute; left:-5000px; }
  footer { font-size:.85rem; color:#666; margin-top:18px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <div class="intro" id="t-intro"></div>

  <form id="f" novalidate>
    <label class="f" for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" autocomplete="name" required maxlength="120">

    <label class="f" for="street_address">Residential street address <span class="opt">(in Victoria–Beacon Hill)</span></label>
    <input id="street_address" name="street_address" type="text" autocomplete="street-address" required maxlength="200" placeholder="e.g. 123 Cook St, Unit 4, Victoria">

    <label class="f" for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" inputmode="tel">

    <label class="f" for="email">Email <span class="opt">(optional)</span></label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="200">

    <label class="f" for="best_time">Best time to reach you</label>
    <input id="best_time" name="best_time" type="text" maxlength="200" placeholder="e.g. weekday evenings, Saturday morning">

    <fieldset>
      <legend>Which signing session(s) can you attend?</legend>
      <p class="hint" id="t-sessions-hint"></p>
      <div id="sessions"></div>
    </fieldset>

    <fieldset>
      <div class="cb"><input id="consent" type="checkbox" required><label for="consent" id="t-consent"></label></div>
    </fieldset>

    <div class="hp" aria-hidden="true"><label>Leave empty <input id="website" type="text" tabindex="-1" autocomplete="off"></label></div>

    <button id="btn" type="submit">Sign me up</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <footer id="t-footer"></footer>
</main>
<script>
/* ======== EDIT TEXT HERE (easy to change after legal check) ======== */
const TEXT = {
  title: "Nominate Joachim Agou",
  sub: "Seeking the BC Conservative nomination · Victoria–Beacon Hill · Provincial election 24 October 2026",
  intro: "Thank you. Nominating is not a vote pledge. You must be an eligible voter living in Victoria–Beacon Hill. Each voter can nominate only one candidate.",
  sessionsHint: "Times to be confirmed. We'll contact you with the exact time.",
  sessions: [
    "Thrifty Foods Fairfield (Cook St & Fairfield Rd area) — time to be confirmed",
    "Thrifty Foods James Bay (Menzies St) — time to be confirmed",
    "Cook Street Village — time to be confirmed",
    "James Bay Market — time to be confirmed",
    "Come to me / I'll arrange a time"
  ],
  consent: "I agree to be contacted by the Joachim Agou campaign about signing the nomination paper. My information will be used only for this nomination.",
  thanks: "Thank you! We'll contact you soon to arrange signing the nomination paper.",
  footer: "Questions? joachim@agou.ca"
};
/* ================================================================== */
const SUPABASE_URL = "https://qhyttuzmysookdgxymrl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJEI3Tmfk2bnZanIF-W1gQ_tgBwW-N7"; // public insert-only key (RLS: cannot read data)

const $ = id => document.getElementById(id);
$("t-title").textContent = TEXT.title; $("t-sub").textContent = TEXT.sub;
$("t-intro").textContent = TEXT.intro; $("t-sessions-hint").textContent = TEXT.sessionsHint;
$("t-consent").textContent = TEXT.consent; $("t-footer").textContent = TEXT.footer;
TEXT.sessions.forEach((s, i) => {
  const d = document.createElement("div"); d.className = "cb";
  d.innerHTML = '<input type="checkbox" name="session" id="s' + i + '"><label for="s' + i + '"></label>';
  d.querySelector("input").value = s; d.querySelector("label").textContent = s;
  $("sessions").appendChild(d);
});
function show(kind, text) { const m = $("msg"); m.className = "msg " + kind; m.textContent = text; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("website").value) return; // bot
  const v = id => $(id).value.trim();
  const errs = [];
  if (v("full_name").length < 2) errs.push("your full name");
  if (v("street_address").length < 4) errs.push("your street address");
  if (v("phone").replace(/\D/g, "").length < 7) errs.push("a phone number");
  if (v("email") && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))) errs.push("a valid email (or leave it empty)");
  if (!$("consent").checked) errs.push("the consent checkbox");
  if (errs.length) { show("err", "Please add " + errs.join(", ") + "."); return; }
  const btn = $("btn"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/submit_nominator_signup", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify({
        p_full_name: v("full_name"), p_street_address: v("street_address"), p_phone: v("phone"),
        p_email: v("email"), p_best_time: v("best_time"),
        p_sessions: [...document.querySelectorAll('input[name=session]:checked')].map(x => x.value),
        p_consent: true, p_consent_text: TEXT.consent
      })
    });
    if (!r.ok) throw new Error(await r.text());
    $("f").querySelectorAll("input,button").forEach(x => x.disabled = true);
    btn.textContent = "Sent ✓"; show("ok", TEXT.thanks);
  } catch (err) {
    btn.disabled = false; btn.textContent = "Sign me up";
    show("err", "Sorry, something went wrong. Please try again, or email joachim@agou.ca.");
  }
});
</script>
</body>
</html>
