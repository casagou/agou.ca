<body>
<main>
  <div id="listView">
    <h1>Events</h1>

</main>
<script>
/* ======== EDIT TEXT HERE ======== */
const TEXT = {
  riding: "Victoria–Beacon Hill",
  empty: "No upcoming events yet. Check back soon.",
  gone: "This event isn't listed any more. It may have ended or been cancelled.",
  loadErr: "Sorry, events couldn't be loaded right now. Please try again in a moment.",
  consent: "I agree that the Joachim Agou campaign (Conservative Party of BC, Victoria–Beacon Hill) may contact me by email, phone or text about this event and the campaign. I can ask to stop at any time.",
  thanks: "Thank you, you're on the list! We look forward to seeing you. We may be in touch with details about the event.",
  rsvpErr: "Sorry, something went wrong and your RSVP was not sent. Please check your details and try again, or email joachim@agou.ca."
};
/* ================================= */
const SUPABASE_URL = "https://qhyttuzmysookdgxymrl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJEI3Tmfk2bnZanIF-W1gQ_tgBwW-N7"; // public key: can only call get_public_events and submit_event_rsvp (RLS: cannot read tables)
const TZ = "America/Vancouver";
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const k in attrs || {}) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } kids.flat().forEach(c => c != null && e.append(c)); return e; };
let EVENTS = null;

// ---- dates (always Pacific) ----
function parts(s) { const o = {}; new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(new Date(s)).forEach(p => o[p.type] = p.value); return o; }
const ymd = s => new Date(s).toLocaleDateString("en-CA", { timeZone: TZ });
const dayLong = s => { const p = parts(s); return p.weekday + " " + p.month + " " + p.day; };
const dayShort = s => { const p = parts(s); return p.month + " " + p.day; };
const clock = s => { const p = parts(s); return p.hour + ":" + p.minute + " " + String(p.dayPeriod || "").toLowerCase(); };
function timeLine(e) { return dayShort(e.starts_at) + " @ " + clock(e.starts_at) + " - " + (ymd(e.starts_at) === ymd(e.ends_at) ? "" : dayShort(e.ends_at) + " @ ") + clock(e.ends_at); }
function heading(e) { return dayLong(e.starts_at) + " | " + TEXT.riding + " | " + e.title; }

// ---- simple, safe markdown: blank line = paragraph, "- " = bullet, **bold**, bare https links. No raw HTML ever. ----
function inline(text) {
  const out = []; const re = /\*\*([^*]+)\*\*|(https?:\/\/[^\s<>"]+[^\s<>".,;:!?)])/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    if (m[1] != null) out.push(el("strong", { text: m[1] }));
    else out.push(el("a", { href: m[2], rel: "noopener noreferrer", target: "_blank", text: m[2] }));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function renderMd(src) {
  const box = el("div", { class: "desc" });
  String(src || "").replace(/\r\n?/g, "\n").split(/\n\s*\n/).forEach(block => {
    const lines = block.split("\n").map(l => l.trimEnd()).filter(l => l.trim());
    if (!lines.length) return;
    let ul = null, p = null;
    lines.forEach(l => {
      const b = /^\s*(?:[-*•])\s+(.*)$/.exec(l);
      if (b) { p = null; if (!ul) { ul = el("ul"); box.append(ul); } ul.append(el("li", null, inline(b[1]))); }
      else { ul = null; if (!p) { p = el("p"); box.append(p); } else p.append(el("br")); p.append(...inline(l.trim())); }
    });
  });
  return box;
}
const plain = s => String(s || "").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/^\s*[-*•]\s+/gm, "").replace(/\s+/g, " ").trim();
function excerpt(s) { const t = plain(s); return t.length > 200 ? t.slice(0, 200).replace(/\s+\S*$/, "") + "…" : t; }
const whereText = e => [e.location_name, e.address].filter(Boolean).join(", ");
const mapUrl = e => whereText(e) ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(whereText(e)) : "";
const eventUrl = e => "https://agou.ca/events/?e=" + e.id;

// ---- calendar ----
const utc = s => new Date(s).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
function icsFold(line) { const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = " " + line.slice(74); } out.push(line); return out.join("\r\n"); }
function downloadIcs(e) {
  const desc = plain(e.description) + (e.description ? "\n\n" : "") + eventUrl(e);
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//agou.ca//Events//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    "UID:event-" + e.id + "@agou.ca", "DTSTAMP:" + utc(new Date()), "DTSTART:" + utc(e.starts_at), "DTEND:" + utc(e.ends_at),
    "SUMMARY:" + icsEsc(e.title), whereText(e) ? "LOCATION:" + icsEsc(whereText(e)) : null, "DESCRIPTION:" + icsEsc(desc), "URL:" + eventUrl(e),
    "END:VEVENT", "END:VCALENDAR"].filter(Boolean).map(icsFold).join("\r\n") + "\r\n";
  const a = el("a", { href: URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" })), download: "agou-event-" + e.id + ".ics" });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function googleCal(e) {
  const q = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates: utc(e.starts_at) + "/" + utc(e.ends_at), ctz: TZ,
    details: (plain(e.description) ? plain(e.description).slice(0, 1200) + "\n\n" : "") + eventUrl(e), location: whereText(e) });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

// ---- views ----
function renderList() {
  const box = $("list"); box.textContent = "";
  if (!EVENTS.length) { box.append(el("p", { class: "empty", text: TEXT.empty })); return; }
  EVENTS.forEach(e => {
    const a = el("a", { href: "?e=" + e.id, text: heading(e) });
    a.addEventListener("click", ev => { if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return; ev.preventDefault(); history.pushState({ e: e.id }, "", "?e=" + e.id); route(); window.scrollTo(0, 0); });
    const ex = excerpt(e.description);
    box.append(el("section", { class: "ev" }, el("h2", null, a), ex ? el("p", { class: "ex", text: ex }) : null, el("span", { class: "badge", text: timeLine(e) })));
  });
}
function setMeta(title, desc, url) {
  document.title = title;
  const set = (sel, attr, v) => { const m = document.querySelector(sel); if (m) m.setAttribute(attr, v); };
  set('meta[name="description"]', "content", desc); set('meta[property="og:title"]', "content", title);
  set('meta[property="og:description"]', "content", desc); set('meta[property="og:url"]', "content", url); set('link[rel="canonical"]', "href", url);
}
function jsonLd(list) {
  let s = $("ld"); if (!s) { s = el("script", { id: "ld", type: "application/ld+json" }); document.head.append(s); }
  s.textContent = JSON.stringify(list.map(e => ({ "@context": "https://schema.org", "@type": "Event", name: e.title, startDate: e.starts_at, endDate: e.ends_at,
    eventStatus: "https://schema.org/EventScheduled", eventAttendanceMode: "https://schema.org/OfflineEventAttendanceMode",
    location: { "@type": "Place", name: e.location_name || e.address || TEXT.riding, address: e.address || e.location_name || "Victoria, BC" },
    description: plain(e.description).slice(0, 500), url: eventUrl(e), organizer: { "@type": "Organization", name: "Joachim Agou campaign (Conservative Party of BC)", url: "https://agou.ca/events/" } })));
}
function backLink() {
  const a = el("a", { href: "./", class: "back", text: "‹ All events" });
  a.addEventListener("click", ev => { ev.preventDefault(); history.pushState({}, "", location.pathname); route(); window.scrollTo(0, 0); });
  return a;
}
function renderDetail(id) {
  const box = $("detailView"); box.textContent = "";
  const e = EVENTS.find(x => String(x.id) === String(id));
  if (!e) { box.append(backLink(), el("p", { class: "note", text: TEXT.gone })); setMeta("Events – Joachim Agou – Victoria–Beacon Hill", "Upcoming events with Joachim Agou in Victoria–Beacon Hill.", "https://agou.ca/events/"); return; }
  setMeta(e.title + " – " + dayLong(e.starts_at) + " – Joachim Agou", (plain(e.description) || heading(e)).slice(0, 160), eventUrl(e));
  jsonLd([e]);
  const where = whereText(e), mu = mapUrl(e);
  box.append(backLink(), el("h1", { text: heading(e) }), el("span", { class: "badge", text: timeLine(e) }));
  if (e.description) box.append(el("div", { class: "card" }, renderMd(e.description)));
  const info = el("div", { class: "card" },
    el("div", { class: "when" }, el("b", { text: "When" }), el("p", { text: dayLong(e.starts_at) + ", " + clock(e.starts_at) + " – " + (ymd(e.starts_at) === ymd(e.ends_at) ? "" : dayLong(e.ends_at) + ", ") + clock(e.ends_at) + " (Pacific time)" })));
  if (where) info.append(el("div", { class: "where" }, el("b", { text: "Where" }),
    e.location_name ? el("p", { text: e.location_name }) : null, e.address ? el("p", { text: e.address }) : null,
    mu ? el("p", null, el("a", { href: mu, target: "_blank", rel: "noopener noreferrer", class: "more", text: "Open in Google Maps ↗" })) : null));
  box.append(info);
  const acts = el("div", { class: "actions" });
  let rsvpBtn = null;
  if (e.rsvp_open) { rsvpBtn = el("button", { type: "button", class: "btn primary", "aria-expanded": "false", "aria-controls": "rsvp", text: "RSVP" }); acts.append(rsvpBtn); }
  const calBtn = el("button", { type: "button", class: "btn sec", "aria-expanded": "false", "aria-haspopup": "true", text: "Add to calendar" });
  const ics = el("button", { type: "button", text: "Apple / Outlook (.ics file)" }); ics.addEventListener("click", () => { downloadIcs(e); menu.hidden = true; calBtn.setAttribute("aria-expanded", "false"); });
  const menu = el("div", { class: "calmenu", hidden: "" }, el("a", { href: googleCal(e), target: "_blank", rel: "noopener noreferrer", text: "Google Calendar ↗" }), ics);
  calBtn.addEventListener("click", () => { menu.hidden = !menu.hidden; calBtn.setAttribute("aria-expanded", String(!menu.hidden)); });
  acts.append(el("div", { class: "cal" }, calBtn, menu));
  if (e.signup_url && /^https?:\/\//i.test(e.signup_url)) acts.append(el("a", { href: e.signup_url, target: "_blank", rel: "noopener noreferrer", class: "btn sec", text: "Sign up ↗" }));
  box.append(acts);
  if (rsvpBtn) { const f = rsvpForm(e); box.append(f); rsvpBtn.addEventListener("click", () => { f.hidden = false; rsvpBtn.setAttribute("aria-expanded", "true"); f.scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(() => $("first_name") && $("first_name").focus({ preventScroll: true }), 300); }); }
}
function field(id, label, type, attrs, opt) {
  return [el("label", { class: "f", for: id }, label, opt ? el("span", { class: "opt", text: " (optional)" }) : null), el("input", Object.assign({ id, name: id, type }, attrs))];
}
function rsvpForm(e) {
  const guests = el("select", { id: "guests", name: "guests" }); for (let i = 0; i <= 10; i++) guests.append(el("option", { value: String(i), text: i === 0 ? "Just me" : "+" + i + (i === 1 ? " guest" : " guests") }));
  const btn = el("button", { id: "btn", type: "submit", text: "Send my RSVP" });
  const msg = el("div", { id: "msg", class: "msg", role: "status", "aria-live": "polite" });
  const f = el("form", { id: "rsvp", novalidate: "", hidden: "" },
    el("h2", { text: "RSVP" }), el("p", { class: "opt", text: e.title + " · " + timeLine(e) }),
    el("div", { class: "row" }, el("div", null, field("first_name", "First name", "text", { autocomplete: "given-name", autocapitalize: "words", required: "", maxlength: "80" })),
      el("div", null, field("last_name", "Last name", "text", { autocomplete: "family-name", autocapitalize: "words", required: "", maxlength: "80" }))),
    field("email", "Email", "email", { autocomplete: "email", autocapitalize: "off", spellcheck: "false", required: "", maxlength: "200", inputmode: "email" }),
    field("phone", "Phone", "tel", { autocomplete: "tel", maxlength: "30", inputmode: "tel" }, true),
    el("label", { class: "f", for: "guests" }, "Bringing anyone?"), guests,
    el("fieldset", null, el("div", { class: "cb" }, el("input", { id: "consent", type: "checkbox", required: "" }), el("label", { for: "consent", text: TEXT.consent }))),
    el("div", { class: "hp", "aria-hidden": "true" }, el("label", null, "Leave empty ", el("input", { id: "website", type: "text", tabindex: "-1", autocomplete: "off" }))),
    btn, msg);
  const show = (k, t) => { msg.className = "msg " + k; msg.textContent = t; };
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const v = id => $(id).value.trim();
    const done = () => { const t = el("div", { class: "thanks", role: "status", text: TEXT.thanks }); f.replaceWith(t); t.scrollIntoView({ behavior: "smooth", block: "center" }); };
    if (v("website")) { done(); return; } // bot
    const errs = [];
    if (!v("first_name")) errs.push("your first name");
    if (!v("last_name")) errs.push("your last name");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))) errs.push("a valid email");
    if (v("phone") && v("phone").replace(/\D/g, "").length < 7) errs.push("a full phone number (or leave it empty)");
    if (!$("consent").checked) errs.push("the consent checkbox");
    if (errs.length) { show("err", "Please add " + errs.join(", ") + "."); return; }
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/submit_event_rsvp", {
        method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
        body: JSON.stringify({ p_event_id: e.id, p_first_name: v("first_name"), p_last_name: v("last_name"), p_email: v("email"),
          p_phone: v("phone") || null, p_guests: +$("guests").value, p_consent: true, p_consent_text: TEXT.consent, p_website: v("website") })
      });
      if (!r.ok) throw new Error(await r.text());
      done();
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send my RSVP";
      show("err", /not open for RSVPs/.test(String(err && err.message)) ? "Sorry, RSVPs for this event are closed." : TEXT.rsvpErr);
    }
  });
  return f;
}
function currentId() { const q = new URLSearchParams(location.search).get("e"); if (q) return q; const h = location.hash.replace(/^#/, ""); return /^\d+$/.test(h) ? h : null; }
function route() {
  if (!EVENTS) return;
  const id = currentId();
  $("listView").hidden = !!id; $("detailView").hidden = !id;
  if (id) renderDetail(id);
  else { setMeta("Events – Joachim Agou – Victoria–Beacon Hill", "Upcoming events with Joachim Agou, seeking the Conservative Party of BC nomination in Victoria–Beacon Hill. Come meet Joachim, RSVP and add events to your calendar.", "https://agou.ca/events/"); renderList(); jsonLd(EVENTS); }
}
window.addEventListener("popstate", route);
window.addEventListener("hashchange", route);
document.addEventListener("click", ev => { const m = document.querySelector(".calmenu"); if (m && !m.hidden && !ev.target.closest(".cal")) { m.hidden = true; const b = document.querySelector(".cal > .btn"); if (b) b.setAttribute("aria-expanded", "false"); } });
(async function load() {
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_public_events", { method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY }, body: "{}" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    EVENTS = await r.json();
    route();
  } catch (err) {
    $("list").textContent = ""; $("list").append(el("p", { class: "note", text: TEXT.loadErr }));
    if (currentId()) { $("listView").hidden = false; }
  }
})();
</script>
</body>
</html>
