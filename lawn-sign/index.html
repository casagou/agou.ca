<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a lawn sign – Joachim Agou – Victoria–Beacon Hill</title>
<meta name="description" content="Request a free Joachim Agou lawn sign in Victoria–Beacon Hill.">
<meta name="robots" content="noindex">
<style>
  :root { --blue:#1a4c8b; --bg:#f5f7fb; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#1b1f24; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:.2em 0 .1em; color:var(--blue); }
  .sub { margin:0 0 1em; color:#444; }
  .intro { background:#fff; border-left:4px solid var(--blue); padding:12px 14px; border-radius:6px; margin-bottom:18px; }
  .intro p { margin:0 0 .5em; } .intro p:last-child { margin:0; }
  form { background:#fff; padding:16px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label.f { display:block; font-weight:600; margin:14px 0 4px; }
  .opt { font-weight:400; color:#666; }
  input[type=text], input[type=tel], input[type=email], textarea { width:100%; padding:12px; font-size:17px; font-family:inherit; border:1px solid #bbb; border-radius:8px; }
  textarea { min-height:76px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--blue); border-color:var(--blue); }
  fieldset { border:0; padding:0; margin:14px 0 0; }
  legend { font-weight:600; margin-bottom:4px; padding:0; }
  .cb { display:flex; gap:10px; align-items:flex-start; padding:10px 0; min-height:44px; }
  .cb input { width:22px; height:22px; margin:1px 0 0; flex:none; }
  .cb label { flex:1; min-height:24px; }
  .req { background:#f4f7fb; border-radius:8px; padding:10px; margin:8px -10px 0; }
  .hint { font-size:.9rem; color:#666; margin:2px 0 0; }
  button { width:100%; margin-top:18px; padding:14px; font-size:18px; font-weight:700; color:#fff; background:var(--blue); border:0; border-radius:8px; }
  button:disabled { opacity:.6; }
  .msg { margin-top:14px; padding:12px; border-radius:8px; display:none; }
  .err { background:#fdecea; color:#8a1c1c; display:block; }
  .ok { background:#e8f5e9; color:#1b5e20; display:block; }
  .hp { position:absolute; left:-5000px; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; min-width:0; }
  .row > div.sm { flex:0 0 34%; }
  @media (max-width:340px) { .row { display:block; } .row > div.sm { flex:1; } }
  footer { font-size:.85rem; color:#666; margin-top:18px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1 id="t-title"></h1>
  <p class="sub" id="t-sub"></p>
  <div class="intro"><p id="t-intro"></p><p id="t-delivery"></p></div>

  <form id="f" novalidate>
    <div class="row">
      <div>
        <label class="f" for="first_name">First name</label>
        <input id="first_name" name="first_name" type="text" autocomplete="given-name" autocapitalize="words" required maxlength="80">
      </div>
      <div>
        <label class="f" for="last_name">Last name</label>
        <input id="last_name" name="last_name" type="text" autocomplete="family-name" autocapitalize="words" required maxlength="80">
      </div>
    </div>

    <label class="f" for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" required maxlength="200" inputmode="email">

    <label class="f" for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" inputmode="tel">

    <div class="row">
      <div>
        <label class="f" for="street_address">Street address</label>
        <input id="street_address" name="street_address" type="text" autocomplete="address-line1" autocapitalize="words" required maxlength="200" placeholder="e.g. 123 Cook St">
      </div>
      <div class="sm">
        <label class="f" for="unit">Unit <span class="opt">(optional)</span></label>
        <input id="unit" name="unit" type="text" autocomplete="address-line2" maxlength="20" placeholder="e.g. 4">
      </div>
    </div>

    <div class="row">
      <div>
        <label class="f" for="city">City</label>
        <input id="city" name="city" type="text" autocomplete="address-level2" autocapitalize="words" required maxlength="80" value="Victoria">
      </div>
      <div class="sm">
        <label class="f" for="postal_code">Postal code</label>
        <input id="postal_code" name="postal_code" type="text" autocomplete="postal-code" autocapitalize="characters" spellcheck="false" required maxlength="7" placeholder="V8V 1A1">
      </div>
    </div>

    <fieldset>
      <legend>Where will the sign go? <span class="opt">(optional)</span></legend>
      <div class="cb"><input id="pl_house" type="radio" name="placement" value="House lawn"><label for="pl_house">House lawn</label></div>
      <div class="cb"><input id="pl_apt" type="radio" name="placement" value="Apartment balcony or window"><label for="pl_apt">Apartment balcony or window</label></div>
      <div class="cb"><input id="pl_bus" type="radio" name="placement" value="Business"><label for="pl_bus">Business</label></div>
    </fieldset>

    <fieldset>
      <div class="cb"><input id="large_sign" type="checkbox"><label for="large_sign" id="t-large"></label></div>
    </fieldset>

    <label class="f" for="delivery_notes">Delivery notes <span class="opt">(optional)</span></label>
    <textarea id="delivery_notes" name="delivery_notes" maxlength="500" rows="3" autocomplete="off" placeholder="e.g. gate code, best spot for the sign, side door"></textarea>

    <fieldset>
      <div class="cb req"><input id="permission" type="checkbox" required><label for="permission" id="t-permission"></label></div>
      <div class="cb"><input id="consent" type="checkbox" required><label for="consent" id="t-consent"></label></div>
    </fieldset>

    <div class="hp" aria-hidden="true"><label>Leave empty <input id="website" type="text" tabindex="-1" autocomplete="off"></label></div>

    <button id="btn" type="submit">Request my lawn sign</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>
  <footer id="t-footer"></footer>
</main>
<script>
/* ======== EDIT TEXT HERE (easy to change after legal check) ======== */
const TEXT = {
  title: "Request a lawn sign",
  sub: "Joachim Agou · Conservative Party of BC · Victoria–Beacon Hill · Provincial election 24 October 2026",
  intro: "Show your support for Joachim Agou in Victoria–Beacon Hill. Lawn signs are free: leave your details and we'll bring one to you.",
  delivery: "Signs are delivered and put up by campaign volunteers, and we'll pick them up after Election Day (24 October).",
  large: "I'd like a large sign if one is available (corner lot or busy street)",
  permission: "I'm the owner, or I have the owner's or landlord's permission to put up a sign here.",
  consent: "I agree that the Joachim Agou campaign (Conservative Party of BC, Victoria–Beacon Hill) may contact me by email, phone or text about my lawn sign and the campaign. I can ask to stop at any time.",
  thanks: "Thank you! We've got your lawn sign request. A volunteer will be in touch about delivery.",
  footer: "Authorized by Bert Chen, financial agent, bert@bertchen.ca, 778-996-9910."
};
/* ================================================================== */
const SUPABASE_URL = "https://qhyttuzmysookdgxymrl.supabase.co";
const SUPABASE_KEY = "sb_publishable_yJEI3Tmfk2bnZanIF-W1gQ_tgBwW-N7"; // public key: can only call submit_lawn_sign_request (RLS: cannot read data)

const $ = id => document.getElementById(id);
$("t-title").textContent = TEXT.title; $("t-sub").textContent = TEXT.sub;
$("t-intro").textContent = TEXT.intro; $("t-delivery").textContent = TEXT.delivery;
$("t-large").textContent = TEXT.large; $("t-permission").textContent = TEXT.permission;
$("t-consent").textContent = TEXT.consent; $("t-footer").textContent = TEXT.footer;
function show(kind, text) { const m = $("msg"); m.className = "msg " + kind; m.textContent = text; }
const BTN = "Request my lawn sign";
const PC = /^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/;
$("postal_code").addEventListener("blur", function () {
  const s = this.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  if (s.length === 6) this.value = s.slice(0, 3) + " " + s.slice(3);
});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  if (v("website")) { show("ok", TEXT.thanks); return; } // bot
  const errs = [];
  if (!v("first_name")) errs.push("your first name");
  if (!v("last_name")) errs.push("your last name");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))) errs.push("a valid email");
  if (v("phone").replace(/\D/g, "").length < 7) errs.push("a phone number");
  if (v("street_address").length < 3) errs.push("your street address");
  if (!v("city")) errs.push("your city");
  if (!PC.test(v("postal_code"))) errs.push("a valid postal code (like V8V 1A1)");
  const ticks = [];
  if (!$("permission").checked) ticks.push("the owner/landlord permission box");
  if (!$("consent").checked) ticks.push("the consent box");
  if (errs.length || ticks.length) {
    show("err", [errs.length ? "Please add " + errs.join(", ") + "." : "", ticks.length ? "Please tick " + ticks.join(" and ") + "." : ""].filter(Boolean).join(" "));
    return;
  }
  const pl = document.querySelector('input[name="placement"]:checked');
  const btn = $("btn"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/submit_lawn_sign_request", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify({
        p_first_name: v("first_name"), p_last_name: v("last_name"), p_email: v("email"), p_phone: v("phone"),
        p_street_address: v("street_address"), p_unit: v("unit"), p_city: v("city"), p_postal_code: v("postal_code"),
        p_large_sign: $("large_sign").checked, p_placement: pl ? pl.value : null, p_has_permission: true,
        p_delivery_notes: v("delivery_notes"), p_consent: true, p_consent_text: TEXT.consent, p_website: v("website")
      })
    });
    if (!r.ok) throw new Error(await r.text());
    $("f").querySelectorAll("input,textarea,button").forEach(x => x.disabled = true);
    btn.textContent = "Sent ✓"; show("ok", TEXT.thanks);
  } catch (err) {
    btn.disabled = false; btn.textContent = BTN;
    show("err", "Sorry, something went wrong and your request was not sent. Please check your details and try again, or email joachim@agou.ca.");
  }
});
</script>
</body>
</html>
